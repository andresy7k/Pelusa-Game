# Blueprint de Render (plan free). La base la da Neon; Render solo corre la API.
# En Render: New → Blueprint → este repo → completar las variables marcadas sync:false.
services:
  - type: web
    name: pelusa-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # CORS_ALLOWED_ORIGINS es opcional: el proxy /api de Vercel evita CORS.
      # Agregala solo si el front llama directo al backend (modo directo).
