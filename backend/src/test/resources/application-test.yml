# Perfil test: H2 en memoria + misma V1 (Flyway) para probar persistencia real.
spring:
  datasource:
    url: jdbc:h2:mem:pelusa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
