# Perfil test: H2 en memoria + misma V1 (Flyway) para probar persistencia real.
spring:
  datasource:
    url: jdbc:h2:mem:pelusa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    # Contar sentencias SQL en las pruebas de rendimiento (PerformanceBudgetTest).
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true

# Las pruebas de reglas juegan sin token y sin límite de pedidos; la seguridad
# se prueba aparte, encendida, en SecurityTest.
pelusa:
  security:
    require-seat-token: false
  rate-limit:
    create-per-minute: 100000
    action-per-minute: 100000
    read-per-minute: 100000
