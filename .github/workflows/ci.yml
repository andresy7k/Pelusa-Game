name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify = unit + integración (MockMvc + H2 real) + JaCoCo report + gate 100 %.
      - name: Build + tests + coverage gate
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14
      - name: Upload jar (para probar local sin JDK)
        uses: actions/upload-artifact@v4
        with:
          name: pelusa-backend
          path: backend/target/*.jar
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # PIT: falla si el mutation score baja de 90 % (mutationThreshold en el pom).
      - name: Mutation testing (PIT)
        working-directory: backend
        run: mvn -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: backend/target/pit-reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck + build
        working-directory: frontend
        run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Playwright (casos 1, 2, robo y fin)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
