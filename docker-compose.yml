services:
  postgres:
    image: postgres:16-alpine
    container_name: pelusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pelusa
      POSTGRES_USER: pelusa
      POSTGRES_PASSWORD: pelusa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelusa -d pelusa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
